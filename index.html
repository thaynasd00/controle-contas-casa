centElement('afterend',sec)}const now=new Date(),months=[];for(let i=5;i>=0;i--)months.push(new Date(now.getFullYear(),now.getMonth()-i,1));const contasVals=months.map(m=>{const y=m.getFullYear(),mo=m.getMonth();return contas.filter(c=>{const d=new Date(c.vencimento+'T12:00');return d.getFullYear()===y&&d.getMonth()===mo}).reduce((s,c)=>s+Number(c.valor||0),0)});const extrasVals=months.map(m=>{const y=m.getFullYear(),mo=m.getMonth();return gastos.filter(g=>{const d=new Date(g.data+'T12:00');return d.getFullYear()===y&&d.getMonth()===mo}).reduce((s,g)=>s+Number(g.valor||0),0)});const max=Math.max(...contasVals,...extrasVals,1),W=640,H=270,L=58,R=22,T=30,B=48,pw=W-L-R,ph=H-T-B;const mkPts=vals=>vals.map((v,i)=>[L+(pw*i/5),T+ph-(v/max)*ph]);const p1=mkPts(contasVals),p2=mkPts(extrasVals),mkPath=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfico de contas e gastos extras dos últimos seis meses" style="display:block;overflow:visible">';for(let j=0;j<4;j++){const y=T+(ph*j/3),val=max*(1-j/3);svg+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e5e7eb" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#6b7280">'+(val>=1000?(val/1000).toFixed(1)+'k':Math.round(val))+'</text>'}svg+='<path d="'+mkPath(p1)+'" fill="none" stroke="#0ea5a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="'+mkPath(p2)+'" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';p1.forEach((p,i)=>{svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#0ea5a8" stroke-width="4"/><text x="'+p[0]+'" y="'+(p[1]-11)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#0f766e">'+(contasVals[i]===0?'':fmt.format(contasVals[i]).replace(',00',''))+'</text>'});p2.forEach((p,i)=>{svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#22c55e" stroke-width="4"/><text x="'+p[0]+'" y="'+(p[1]+18)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#15803d">'+(extrasVals[i]===0?'':fmt.format(extrasVals[i]).replace(',00',''))+'</text><text x="'+p[0]+'" y="'+(H-16)+'" text-anchor="middle" font-size="11" fill="#6b7280">'+months[i].toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</text>'});svg+='</svg>';const area=document.getElementById('graficoGastosArea');if(area)area.innerHTML=svg}const oldRenderCost=renderCost;renderCost=function(){oldRenderCost();drawExpenseChart()};try{drawExpenseChart()}catch(e){}})();`)}catch(e){console.error('Gráfico não carregou',e)}});</script></body></html>
