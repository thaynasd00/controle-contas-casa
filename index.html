<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Controle de Contas de Casa</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:system-ui;color:#111827}.app{max-width:900px;margin:auto;padding:16px}.card,.item{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:12px}h1{margin:8px 0}.muted{color:#6b7280}.tabs,.metrics,.actions{display:flex;gap:8px}.tabs button{flex:1}.metrics .card{flex:1}button,input,select,textarea{font:inherit;border-radius:10px}button{border:0;padding:10px 13px;cursor:pointer}.primary{background:#111827;color:white}.secondary{background:#e5e7eb}.wa{background:#22c55e;color:#fff;font-weight:700}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;background:#fff}label{font-size:12px;color:#6b7280}.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.wide{grid-column:1/-1}.hidden{display:none!important}.item{display:flex;justify-content:space-between;gap:10px}.badge{padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.pendente{background:#fee2e2;color:#991b1b}.programado{background:#fef3c7;color:#92400e}.pago{background:#dcfce7;color:#166534}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:62px;background:#fff;border:1px solid #e5e7eb;padding:5px}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.dot{width:8px;height:8px;border-radius:50%}.dot.pendente{background:#dc2626}.dot.programado{background:#d97706}.dot.pago{background:#16a34a}@media(max-width:650px){.metrics,.item{display:block}.form{grid-template-columns:1fr 1fr}.metrics .card{margin-bottom:8px}.day{min-height:50px}.actions{flex-wrap:wrap}}</style></head><body><main class="app"><section id="auth" class="card"><h2>Entrar no Controle de Contas</h2><p class="muted">Use o mesmo e-mail e senha nos dois celulares.</p><div class="form"><div><label>E-mail</label><input id="email" type="email"></div><div><label>Senha</label><input id="senha" type="password" minlength="6"></div><button id="entrar" class="primary">Entrar</button><button id="criar" class="secondary">Criar acesso</button></div><p id="msg" class="muted"></p></section><div id="conteudo" class="hidden"><div class="actions" style="justify-content:space-between;align-items:center"><div><h1>🏠 Controle de Contas de Casa</h1><div class="muted">Contas sincronizadas na nuvem</div></div><button id="sair" class="secondary">Sair</button></div><div class="tabs"><button id="sem" class="primary">📅 Semanal</button><button id="mes" class="secondary">🗓️ Mensal</button></div><section class="metrics"><div class="card"><small>Total</small><h2 id="total">R$ 0,00</h2></div><div class="card"><small>Pago</small><h2 id="pago">R$ 0,00</h2></div><div class="card"><small>Falta pagar</small><h2 id="falta">R$ 0,00</h2></div></section><section class="card"><div class="form"><div><label>Conta</label><input id="nome" placeholder="Ex.: Luz"></div><div><label>Valor</label><input id="valor" inputmode="numeric" placeholder="0,00"></div><div><label>Vencimento</label><input id="venc" type="date"></div><div><label>Status</label><select id="status"><option value="pendente">Pendente</option><option value="programado">Programado</option><option value="pago">Pago</option></select></div><div class="wide"><label>Observações</label><textarea id="obs"></textarea></div><button id="add" class="primary">+ Adicionar</button></div></section><section id="calcard" class="card hidden"><div class="actions" style="justify-content:space-between"><button id="ant">‹</button><strong id="tituloMes"></strong><button id="prox">›</button></div><div class="calendar" id="cal"></div><p class="muted">🔴 Pendente &nbsp; 🟡 Programado &nbsp; 🟢 Pago</p></section><div class="actions"><button id="whats" class="wa">📲 Enviar resumo no WhatsApp</button></div><h2 id="tituloLista">Contas da semana</h2><div id="lista"></div></div></main><script>const U='https://zqzsschiraaakzsincut.supabase.co',K='sb_publishable_7Qb0FQXeMBMHcbTRwDFWYA_mSsBcU5V',db=supabase.createClient(U,K),$=x=>document.getElementById(x),fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});let user=null,contas=[],view='sem',calDate=new Date();function iso(d){return d.toISOString().slice(0,10)}function cap(s){return s.replace(/(^|[.!?]\s+)([a-záàâãéêíóôõúç])/g,(m,a,b)=>a+b.toUpperCase())}function money(v){let n=v.replace(/\D/g,'');return n?(Number(n)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''}function num(v){return Number(v.replace(/\./g,'').replace(',','.'))||0}function week(){let n=new Date(),d=n.getDay()||7,s=new Date(n);s.setDate(n.getDate()-d+1);s.setHours(0,0,0,0);let e=new Date(s);e.setDate(s.getDate()+6);return[s,e]}function period(c){let d=new Date(c.vencimento+'T12:00');if(view==='sem'){let[s,e]=week();return d>=s&&d<=e}return d.getMonth()===calDate.getMonth()&&d.getFullYear()===calDate.getFullYear()}function show(){ $('auth').classList.toggle('hidden',!!user);$('conteudo').classList.toggle('hidden',!user);if(user)load()}async function load(){let{data,error}=await db.from('contas').select('*').order('vencimento');if(error)return alert(error.message);contas=data||[];render()}function render(){let a=contas.filter(period),t=a.reduce((s,c)=>s+Number(c.valor),0),p=a.filter(c=>c.status==='pago').reduce((s,c)=>s+Number(c.valor),0);$('total').textContent=fmt.format(t);$('pago').textContent=fmt.format(p);$('falta').textContent=fmt.format(t-p);$('tituloLista').textContent=view==='sem'?'Contas da semana':'Contas do mês';$('calcard').classList.toggle('hidden',view!=='mes');$('lista').innerHTML=a.length?a.map(c=>`<div class="item"><div><b>${c.nome}</b><div class="muted">${fmt.format(c.valor)} · vence ${new Date(c.vencimento+'T12:00').toLocaleDateString('pt-BR')}</div>${c.observacoes?`<div>📝 ${c.observacoes}</div>`:''}</div><div><span class="badge ${c.status}">${c.status}</span><select onchange="st(${c.id},this.value)"><option value="pendente" ${c.status==='pendente'?'selected':''}>Pendente</option><option value="programado" ${c.status==='programado'?'selected':''}>Programado</option><option value="pago" ${c.status==='pago'?'selected':''}>Pago</option></select><button onclick="del(${c.id})">🗑️</button></div></div>`).join(''):'<div class="card muted">Nenhuma conta neste período.</div>';if(view==='mes')calendar()}function calendar(){$('tituloMes').textContent=calDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let first=new Date(calDate.getFullYear(),calDate.getMonth(),1),off=(first.getDay()+6)%7,start=new Date(first);start.setDate(1-off);let h='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=iso(d),cs=contas.filter(c=>c.vencimento===ds);h+=`<div class="day"><b>${d.getDate()}</b><div class="dots">${cs.map(c=>`<i class="dot ${c.status}" title="${c.nome}"></i>`).join('')}</div></div>`}$('cal').innerHTML=h}window.st=async(id,status)=>{let{error}=await db.from('contas').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()};window.del=async id=>{if(confirm('Excluir esta conta?')){let{error}=await db.from('contas').delete().eq('id',id);if(error)alert(error.message);else load()}};$('valor').oninput=e=>e.target.value=money(e.target.value);['nome','obs'].forEach(x=>$(x).oninput=e=>e.target.value=cap(e.target.value));$('venc').value=iso(new Date());$('add').onclick=async()=>{let row={nome:cap($('nome').value.trim()),valor:num($('valor').value),vencimento:$('venc').value,status:$('status').value,observacoes:cap($('obs').value.trim()),user_id:user.id};if(!row.nome||!row.vencimento)return alert('Preencha conta e vencimento.');let{error}=await db.from('contas').insert(row);if(error)alert(error.message);else{$('nome').value=$('valor').value=$('obs').value='';load()}};$('sem').onclick=()=>{view='sem';$('sem').className='primary';$('mes').className='secondary';render()};$('mes').onclick=()=>{view='mes';calDate=new Date();$('mes').className='primary';$('sem').className='secondary';render()};$('ant').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);render()};$('prox').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);render()};$('entrar').onclick=async()=>{let{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('senha').value});$('msg').textContent=error?error.message:'';if(data?.user){user=data.user;show()}};$('criar').onclick=async()=>{let{data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('senha').value});$('msg').textContent=error?error.message:(data.session?'Acesso criado.':'Acesso criado. Confira seu e-mail para confirmar.');if(data?.session){user=data.user;show()}};$('sair').onclick=async()=>{await db.auth.signOut();user=null;show()};$('whats').onclick=()=>{let a=contas.filter(period),t=a.reduce((s,c)=>s+Number(c.valor),0),p=a.filter(c=>c.status==='pago').reduce((s,c)=>s+Number(c.valor),0),ic={pendente:'🔴',programado:'🟡',pago:'🟢'},txt=`🏠 *CONTAS ${view==='sem'?'DA SEMANA':'DO MÊS'}*\n\n`+a.map(c=>`${ic[c.status]} ${c.nome} — ${fmt.format(c.valor)} — ${c.status==='pago'?'PAGO':'vence '+new Date(c.vencimento+'T12:00').toLocaleDateString('pt-BR')}${c.observacoes?'\n📝 '+c.observacoes:''}`).join('\n')+`\n\n💰 Total: ${fmt.format(t)}\n✅ Pago: ${fmt.format(p)}\n⏳ Falta: ${fmt.format(t-p)}`;open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')};db.auth.getSession().then(({data})=>{user=data.session?.user||null;show()});</script></body></html>
