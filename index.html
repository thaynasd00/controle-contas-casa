<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Controle de Contas de Casa</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:system-ui;color:#111827}.app{max-width:900px;margin:auto;padding:16px}.card,.item{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin:12px 0}.muted{color:#6b7280}.tabs,.metrics,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1;min-width:130px}.metrics .card{flex:1;min-width:125px}.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.catcard{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.clickable{cursor:pointer;border:2px solid #fecaca}.danger{color:#b91c1c}button,input,select,textarea{font:inherit;border-radius:10px}button{border:0;padding:10px 13px;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.wa{background:#22c55e;color:#fff;font-weight:700}.edit{background:#dbeafe;color:#1e40af}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;background:#fff}label{font-size:12px;color:#6b7280}.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.wide{grid-column:1/-1}.hidden{display:none!important}.item{display:flex;justify-content:space-between;gap:10px}.itemBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.pendente{background:#fee2e2;color:#991b1b}.programado{background:#fef3c7;color:#92400e}.pago{background:#dcfce7;color:#166534}@media(max-width:650px){.metrics,.item{display:block}.form{grid-template-columns:1fr 1fr}.catgrid{grid-template-columns:1fr 1fr}.itemBtns{margin-top:10px}.tabs button{min-width:46%}}</style></head><body><main class="app"><section id="auth" class="card"><h2>Entrar no Controle de Contas</h2><div class="form"><div><label>E-mail</label><input id="email" type="email"></div><div><label>Senha</label><input id="senha" type="password"></div><button id="entrar" class="primary">Entrar</button><button id="criar" class="secondary">Criar acesso</button></div><p id="msg" class="muted"></p></section><div id="conteudo" class="hidden"><h1>🏠 Controle de Contas de Casa</h1><button id="sair" class="secondary">Sair</button><section class="card"><h2>💰 Custo mensal da casa</h2><div id="custoMensal" class="catgrid"></div></section><div class="tabs"><button id="sem">📍 Esta semana</button><button id="proxsem">⏭️ Próxima semana</button><button id="atraso">🔴 Em atraso</button><button id="mes">🗓️ Mensal</button><button id="extras">🛒 Gastos Extras</button></div><div id="contasArea"><h3 id="periodo"></h3><section class="metrics"><div class="card">Total<h2 id="total"></h2></div><div class="card">Pago<h2 id="pago"></h2></div><div class="card">Falta pagar<h2 id="falta"></h2></div><div class="card">🔴 Vencidas<h2 id="vencidas"></h2></div></section><section class="card"><h2>Nova conta</h2><div class="form"><div><label>Conta</label><input id="nome"></div><div><label>Valor</label><input id="valor"></div><div><label>Vencimento</label><input id="venc" type="date"></div><div><label>Status</label><select id="status"><option value="pendente">Pendente</option><option value="programado">Programado</option><option value="pago">Pago</option></select></div><div class="wide"><label>Observações</label><textarea id="obs"></textarea></div><button id="add" class="primary">+ Adicionar</button></div></section><button id="whats" class="wa">📲 Enviar resumo no WhatsApp</button><h2 id="tituloLista"></h2><div id="lista"></div></div><div id="extrasArea" class="hidden"><section class="metrics"><div class="card">Gastos extras deste mês<h2 id="totalExtras"></h2></div></section><section class="card"><h2>Quanto gastamos com cada coisa</h2><div id="catTotais" class="catgrid"></div></section><section class="card"><h2>Novo gasto</h2><div class="form"><div><label>Categoria</label><select id="cat"><option>Gasolina</option><option>Delivery</option><option>Mercado</option><option>Saídas</option><option>Outros</option></select></div><div><label>Valor</label><input id="gvalor"></div><div><label>Data</label><input id="gdata" type="date"></div><div><label>Descrição / Local</label><input id="gdesc"></div><div id="notaBox" class="wide hidden"><label>📷 Foto da nota do mercado</label><input id="gnota" type="file" accept="image/*"></div><div class="wide"><label>Observações</label><textarea id="gobs"></textarea></div><button id="gadd" class="primary">+ Adicionar gasto</button></div></section><button id="gwhats" class="wa">📲 Enviar gastos no WhatsApp</button><h2>Gastos deste mês</h2><div id="glista"></div></div></div></main><div id="modal" class="modal hidden" style="position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px;z-index:10"><div class="card" style="width:min(600px,100%);max-height:90vh;overflow:auto"><h2 id="mtitle"></h2><div id="mform" class="form"></div><div class="actions"><button id="msave" class="primary">💾 Salvar alterações</button><button id="mcancel" class="secondary">Cancelar</button></div></div></div><script>const U='https://zqzsschiraaakzsincut.supabase.co',K='sb_publishable_7Qb0FQXeMBMHcbTRwDFWYA_mSsBcU5V',db=supabase.createClient(U,K),$=x=>document.getElementById(x),fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),CATS=['Gasolina','Delivery','Mercado','Saídas','Outros'];let user,contas=[],gastos=[],view='sem';const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),num=v=>Number(String(v).replace(/\./g,'').replace(',','.'))||0,br=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR'),cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';function week(o=0){let n=new Date(),d=n.getDay()||7,s=new Date(n);s.setDate(n.getDate()-d+1+o*7);s.setHours(0,0,0,0);let e=new Date(s);e.setDate(s.getDate()+6);return[s,e]}function fd(d){return['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()]+' '+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}function inView(c){let d=new Date(c.vencimento+'T12:00');if(view==='atraso')return c.status!=='pago'&&c.vencimento<iso(new Date());if(view==='sem'||view==='proxsem'){let[s,e]=week(view==='proxsem'?1:0);return d>=s&&d<=e}let n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}async function load(){let[a,b]=await Promise.all([db.from('contas').select('*').order('vencimento'),db.from('gastos_extras').select('*').order('data',{ascending:false})]);if(a.error||b.error)return alert((a.error||b.error).message);contas=a.data||[];gastos=b.data||[];render()}function renderCost(){let n=new Date(),hoje=iso(n),cm=contas.filter(c=>{let d=new Date(c.vencimento+'T12:00');return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}),gm=gastos.filter(g=>{let d=new Date(g.data+'T12:00');return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}),fix=cm.reduce((s,c)=>s+ +c.valor,0),atraso=contas.filter(c=>c.status!=='pago'&&c.vencimento<hoje).reduce((s,c)=>s+ +c.valor,0),pc={};CATS.forEach(c=>pc[c]=0);gm.forEach(g=>pc[g.categoria]=(pc[g.categoria]||0)+ +g.valor);let variaveis=Object.values(pc).reduce((a,b)=>a+b,0),custo=fix+variaveis;$('custoMensal').innerHTML=`<div class="catcard"><small>Custo do mês</small><br><b>${fmt.format(custo)}</b></div><div class="catcard clickable" onclick="abrirAtraso()"><small>🔴 Contas em atraso</small><br><b class="danger">${fmt.format(atraso)}</b><br><small>Toque para ver</small></div><div class="catcard"><small>💸 Total geral a pagar</small><br><b>${fmt.format(custo+atraso)}</b></div>${CATS.map(c=>`<div class="catcard"><small>${c}</small><br><b>${fmt.format(pc[c])}</b></div>`).join('')}`}window.abrirAtraso=()=>{view='atraso';render()};function render(){renderCost();['sem','proxsem','atraso','mes','extras'].forEach(x=>$(x).className=x===view?'primary':'secondary');$('contasArea').classList.toggle('hidden',view==='extras');$('extrasArea').classList.toggle('hidden',view!=='extras');if(view==='extras')return renderExtras();let a=contas.filter(inView),t=a.reduce((s,c)=>s+ +c.valor,0),p=a.filter(c=>c.status==='pago').reduce((s,c)=>s+ +c.valor,0),v=a.filter(c=>c.status!=='pago'&&c.vencimento<iso(new Date())).reduce((s,c)=>s+ +c.valor,0);$('total').textContent=fmt.format(t);$('pago').textContent=fmt.format(p);$('falta').textContent=fmt.format(t-p);$('vencidas').textContent=fmt.format(v);if(view==='sem'){let[s,e]=week();$('periodo').textContent='📍 Esta semana — '+fd(s)+' a '+fd(e);$('tituloLista').textContent='Contas desta semana'}else if(view==='proxsem'){let[s,e]=week(1);$('periodo').textContent='⏭️ Próxima semana — '+fd(s)+' a '+fd(e);$('tituloLista').textContent='Contas da próxima semana'}else if(view==='atraso'){$('periodo').textContent='🔴 Todas as contas vencidas e ainda não pagas';$('tituloLista').textContent='Contas em atraso'}else{$('periodo').textContent='🗓️ Contas do mês';$('tituloLista').textContent='Contas do mês'}$('lista').innerHTML=a.length?a.map(c=>`<div class="item"><div><b>${c.nome}</b><div class="muted">${fmt.format(c.valor)} · vence ${br(c.vencimento)}</div>${c.data_pagamento?`<div>✅ Pago em ${br(c.data_pagamento)}</div>`:''}${c.observacoes?`<div>📝 ${c.observacoes}</div>`:''}</div><div class="itemBtns"><span class="badge ${c.status}">${c.status}</span>${c.status!=='pago'?`<button onclick="pagar(${c.id})">✅ Pagar</button>`:''}<button class="edit" onclick="editConta(${c.id})">✏️ Editar</button><button onclick="delConta(${c.id})">🗑️</button></div></div>`).join(''):'<div class="card muted">Nenhuma conta neste período.</div>'}function renderExtras(){let n=new Date(),a=gastos.filter(g=>{let d=new Date(g.data+'T12:00');return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}),pc={};CATS.forEach(c=>pc[c]=0);a.forEach(g=>pc[g.categoria]=(pc[g.categoria]||0)+ +g.valor);$('totalExtras').textContent=fmt.format(a.reduce((s,g)=>s+ +g.valor,0));$('catTotais').innerHTML=CATS.map(c=>`<div class="catcard"><small>${c}</small><br><b>${fmt.format(pc[c])}</b></div>`).join('');$('glista').innerHTML=a.length?a.map(g=>`<div class="item"><div><b>${g.categoria}${g.descricao?' — '+g.descricao:''}</b><div class="muted">${fmt.format(g.valor)} · ${br(g.data)}</div>${g.nota_url?`<div><a href="${g.nota_url}" target="_blank">📷 Ver nota do mercado</a></div>`:''}${g.observacoes?`<div>📝 ${g.observacoes}</div>`:''}</div><div class="itemBtns"><button class="edit" onclick="editGasto(${g.id})">✏️ Editar</button><button onclick="delGasto(${g.id})">🗑️</button></div></div>`).join(''):'<div class="card muted">Nenhum gasto neste mês.</div>'}window.editGasto=id=>{let g=gastos.find(x=>x.id===id);$('mtitle').textContent='✏️ Editar gasto';$('mform').innerHTML=`<div><label>Categoria</label><select id="ecat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Valor</label><input id="egvalor" value="${(+g.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}"></div><div><label>Data</label><input id="egdata" type="date" value="${g.data}"></div><div><label>Descrição / Local</label><input id="egdesc" value="${g.descricao||''}"></div><div class="wide"><label>Observações</label><textarea id="egobs">${g.observacoes||''}</textarea></div>`;$('ecat').value=g.categoria;$('modal').classList.remove('hidden');$('modal').style.display='flex';$('msave').onclick=async()=>{let r=await db.from('gastos_extras').update({categoria:$('ecat').value,valor:num($('egvalor').value),data:$('egdata').value,descricao:cap($('egdesc').value),observacoes:$('egobs').value}).eq('id',id);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');$('modal').style.display='none';load()}};window.pagar=id=>{let c=contas.find(x=>x.id===id);$('mtitle').textContent='✅ Registrar pagamento';$('mform').innerHTML=`<div class="wide"><label>Data do pagamento</label><input id="epag" type="date" value="${iso(new Date())}"></div>`;$('modal').classList.remove('hidden');$('modal').style.display='flex';$('msave').onclick=async()=>{let r=await db.from('contas').update({status:'pago',data_pagamento:$('epag').value}).eq('id',id);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');$('modal').style.display='none';load()}};window.editConta=id=>{let c=contas.find(x=>x.id===id);$('mtitle').textContent='✏️ Editar conta';$('mform').innerHTML=`<div><label>Conta</label><input id="enome" value="${c.nome}"></div><div><label>Valor</label><input id="evalor" value="${(+c.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}"></div><div><label>Vencimento</label><input id="evenc" type="date" value="${c.vencimento}"></div><div><label>Status</label><select id="estatus"><option value="pendente">Pendente</option><option value="programado">Programado</option><option value="pago">Pago</option></select></div><div class="wide"><label>Data do pagamento</label><input id="epag" type="date" value="${c.data_pagamento||''}"></div><div class="wide"><label>Observações</label><textarea id="eobs">${c.observacoes||''}</textarea></div>`;$('estatus').value=c.status;$('modal').classList.remove('hidden');$('modal').style.display='flex';$('msave').onclick=async()=>{let st=$('estatus').value,dp=st==='pago'?($('epag').value||iso(new Date())):null,r=await db.from('contas').update({nome:cap($('enome').value),valor:num($('evalor').value),vencimento:$('evenc').value,status:st,data_pagamento:dp,observacoes:$('eobs').value}).eq('id',id);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');$('modal').style.display='none';load()}};window.delConta=async id=>{if(confirm('Excluir esta conta?')){await db.from('contas').delete().eq('id',id);load()}};window.delGasto=async id=>{if(confirm('Excluir este gasto?')){await db.from('gastos_extras').delete().eq('id',id);load()}};$('add').onclick=async()=>{let st=$('status').value,r=await db.from('contas').insert({nome:cap($('nome').value),valor:num($('valor').value),vencimento:$('venc').value,status:st,data_pagamento:st==='pago'?iso(new Date()):null,observacoes:$('obs').value,user_id:user.id});if(r.error)return alert(r.error.message);load()};async function uploadNota(){let f=$('gnota').files[0];if(!f)return null;let path=user.id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await db.storage.from('notas-mercado').upload(path,f);if(u.error)throw u.error;return db.storage.from('notas-mercado').getPublicUrl(path).data.publicUrl}$('gadd').onclick=async()=>{try{let nota=$('cat').value==='Mercado'?await uploadNota():null,r=await db.from('gastos_extras').insert({categoria:$('cat').value,valor:num($('gvalor').value),data:$('gdata').value,descricao:cap($('gdesc').value),observacoes:$('gobs').value,nota_url:nota,user_id:user.id});if(r.error)throw r.error;load()}catch(e){alert(e.message)}};$('cat').onchange=()=> $('notaBox').classList.toggle('hidden',$('cat').value!=='Mercado');['sem','proxsem','atraso','mes','extras'].forEach(x=>$(x).onclick=()=>{view=x;render()});$('mcancel').onclick=()=>{$('modal').classList.add('hidden');$('modal').style.display='none'};$('whats').onclick=()=>{let a=contas.filter(inView),txt=$('periodo').textContent+'\n\n'+a.map(c=>`${c.status==='pago'?'✅':'🔴'} ${c.nome} — ${fmt.format(c.valor)} — vence ${br(c.vencimento)}`).join('\n')+'\n\nTotal: '+fmt.format(a.reduce((s,c)=>s+ +c.valor,0));location.href='https://wa.me/?text='+encodeURIComponent(txt)};$('gwhats').onclick=()=>{let n=new Date(),a=gastos.filter(g=>{let d=new Date(g.data+'T12:00');return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}),txt='🛒 Gastos extras do mês\n\n'+a.map(g=>`${g.categoria}: ${fmt.format(g.valor)} — ${br(g.data)}`).join('\n')+'\n\nTotal: '+fmt.format(a.reduce((s,g)=>s+ +g.valor,0));location.href='https://wa.me/?text='+encodeURIComponent(txt)};$('entrar').onclick=async()=>{let{data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('senha').value});if(error)return $('msg').textContent=error.message;user=data.user;show()};$('criar').onclick=async()=>{let{error}=await db.auth.signUp({email:$('email').value,password:$('senha').value});$('msg').textContent=error?error.message:'Acesso criado.'};$('sair').onclick=async()=>{await db.auth.signOut();user=null;show()};function show(){$('auth').classList.toggle('hidden',!!user);$('conteudo').classList.toggle('hidden',!user);if(user)load()}db.auth.getSession().then(({data})=>{user=data.session?.user||null;show()});$('venc').value=$('gdata').value=iso(new Date());</script></body></html>
