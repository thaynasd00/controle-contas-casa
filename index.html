<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0ea5a8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Contas da Casa"><title>Controle de Contas de Casa</title><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260901"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=20260901"><link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=20260901"><link rel="manifest" href="./manifest.webmanifest?v=20260901"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="appFrame" src="./app.html?v=20260907-contasdetalhes1" title="Controle de Contas de Casa" allow="camera *"></iframe><script>const frame=document.getElementById('appFrame');frame.addEventListener('load',()=>{try{frame.contentWindow.eval(`(()=>{if(window.__enhancedV4)return;window.__enhancedV4=true;function drawExpenseChart(){const base=document.getElementById('custoMensal');if(!base)return;let sec=document.getElementById('graficoGastos');if(!sec){sec=document.createElement('section');sec.id='graficoGastos';sec.className='card';sec.innerHTML='<h2 style="margin-bottom:4px">📈 Gastos mensais</h2><p class="muted" style="margin-top:0">Evolução dos últimos 6 meses</p><div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:8px 0 4px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#111827;margin-right:6px"></i>Contas</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;margin-right:6px"></i>Gastos extras</span></div><div id="graficoGastosArea"></div>';base.closest('section').insertAdjacentElement('afterend',sec)}const now=new Date(),months=[];for(let i=5;i>=0;i--)months.push(new Date(now.getFullYear(),now.getMonth()-i,1));const contasVals=months.map(m=>{const y=m.getFullYear(),mo=m.getMonth();return contas.filter(c=>{const d=new Date(c.vencimento+'T12:00');return d.getFullYear()===y&&d.getMonth()===mo}).reduce((s,c)=>s+Number(c.valor||0),0)});const extrasVals=months.map(m=>{const y=m.getFullYear(),mo=m.getMonth();return gastos.filter(g=>{const d=new Date(g.data+'T12:00');return d.getFullYear()===y&&d.getMonth()===mo}).reduce((s,g)=>s+Number(g.valor||0),0)});const max=Math.max(...contasVals,...extrasVals,1),W=640,H=270,L=58,R=22,T=30,B=48,pw=W-L-R,ph=H-T-B;const mkPts=vals=>vals.map((v,i)=>[L+(pw*i/5),T+ph-(v/max)*ph]);const p1=mkPts(contasVals),p2=mkPts(extrasVals),mkPath=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible">';for(let j=0;j<4;j++){const y=T+(ph*j/3),val=max*(1-j/3);svg+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e5e7eb"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#6b7280">'+(val>=1000?(val/1000).toFixed(1)+'k':Math.round(val))+'</text>'}svg+='<path d="'+mkPath(p1)+'" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><path d="'+mkPath(p2)+'" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>';p1.forEach((p,i)=>svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#111827" stroke-width="4"/><text x="'+p[0]+'" y="'+(p[1]-11)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#111827">'+(contasVals[i]?fmt.format(contasVals[i]).replace(',00',''):'')+'</text>');p2.forEach((p,i)=>svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#dc2626" stroke-width="4"/><text x="'+p[0]+'" y="'+(p[1]+18)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">'+(extrasVals[i]?fmt.format(extrasVals[i]).replace(',00',''):'')+'</text><text x="'+p[0]+'" y="'+(H-16)+'" text-anchor="middle" font-size="11" fill="#6b7280">'+months[i].toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</text>');svg+='</svg>';const area=document.getElementById('graficoGastosArea');if(area)area.innerHTML=svg}const oldRenderCost=renderCost;renderCost=function(){oldRenderCost();drawExpenseChart()};try{drawExpenseChart()}catch(e){}
const presets=['Conta de luz','Cartão de crédito Thayna','Cartão de crédito Elias','Internet fixa','Celular Elias','Celular Thayna','Financiamento apartamento','Financiamento moto Thayna','Condomínio','IPTU','Entrada parcelada'];const nome=document.getElementById('nome');if(nome){const dl=document.createElement('datalist');dl.id='contasFixas';dl.innerHTML=presets.map(x=>'<option value="'+x+'"></option>').join('');document.body.appendChild(dl);nome.setAttribute('list','contasFixas');nome.placeholder='Escolha uma conta fixa ou digite outra';}
const detail=document.createElement('div');detail.id='contaDetalhe';detail.className='hidden';detail.style.cssText='position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px;z-index:30';detail.innerHTML='<div class="card" style="width:min(520px,100%);max-height:90vh;overflow:auto"><div class="actions" style="justify-content:space-between;align-items:center"><h2 id="cdTitulo" style="margin:0">Detalhes da conta</h2><button id="cdFechar" class="secondary">✕</button></div><div id="cdBody" style="margin-top:16px"></div><div id="cdAcoes" class="actions" style="margin-top:16px"></div></div>';document.body.appendChild(detail);const closeDetail=()=>{detail.classList.add('hidden');detail.style.display='none'};document.getElementById('cdFechar').onclick=closeDetail;detail.addEventListener('click',e=>{if(e.target===detail)closeDetail()});window.abrirContaDetalhe=id=>{const c=contas.find(x=>Number(x.id)===Number(id));if(!c)return;document.getElementById('cdTitulo').textContent=c.nome||'Detalhes da conta';document.getElementById('cdBody').innerHTML='<div style="display:grid;gap:10px"><div><small class="muted">Valor</small><br><b>'+fmt.format(Number(c.valor||0))+'</b></div><div><small class="muted">Vencimento</small><br><b>'+br(c.vencimento)+'</b></div><div><small class="muted">Status</small><br><span class="badge '+esc(c.status)+'">'+esc(c.status)+'</span></div>'+(c.recorrente?'<div><small class="muted">Recorrência</small><br><b>🔁 Mensal</b></div>':'')+(c.data_pagamento?'<div><small class="muted">Pagamento</small><br><b>✅ '+br(c.data_pagamento)+'</b></div>':'')+'<div><small class="muted">Observações</small><br>'+(c.observacoes?esc(c.observacoes):'<span class="muted">Sem observações</span>')+'</div></div>';document.getElementById('cdAcoes').innerHTML=(c.status!=='pago'?'<button class="primary" id="cdPagar">✅ Marcar como paga</button>':'')+'<button class="edit" id="cdEditar">✏️ Editar</button><button class="secondary" id="cdExcluir">🗑️ Excluir</button>';const p=document.getElementById('cdPagar');if(p)p.onclick=()=>{closeDetail();pagar(Number(c.id))};document.getElementById('cdEditar').onclick=()=>{closeDetail();editConta(Number(c.id))};document.getElementById('cdExcluir').onclick=()=>{closeDetail();delConta(Number(c.id))};detail.classList.remove('hidden');detail.style.display='flex'};
const lista=document.getElementById('lista');if(lista){lista.addEventListener('click',e=>{if(e.target.closest('button'))return;const item=e.target.closest('.item');if(!item)return;const edit=item.querySelector('button[onclick*="editConta"]');if(!edit)return;const m=(edit.getAttribute('onclick')||'').match(/editConta\\((\\d+)\\)/);if(m)abrirContaDetalhe(Number(m[1]))});const mo=new MutationObserver(()=>{lista.querySelectorAll('.item').forEach(i=>{i.style.cursor='pointer';i.title='Clique para ver os detalhes'})});mo.observe(lista,{childList:true,subtree:true});}
})()`)}catch(e){console.error('Recursos extras não carregaram',e)}});</script></body></html>
